name: Actualizar EPG

# Regenera epg.xml y la lista M3U propia (lista.m3u) a diario, al hacer push y
# bajo demanda. Ambos archivos se publican en la raiz del repositorio, asi que
# GitHub Pages (Deploy from a branch -> main) los sirve directamente en:
#   https://USUARIO.github.io/REPOSITORIO/epg.xml
#   https://USUARIO.github.io/REPOSITORIO/lista.m3u
on:
  schedule:
    # Todos los dias a las 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generar_epg.py"
      - "mapeo_canales.json"
      - "categorias_tematicas.json"
      - "tests/**"
      - ".github/workflows/actualizar-epg.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-epg
  cancel-in-progress: true

jobs:
  generar:
    name: Generar y publicar epg.xml y lista.m3u
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Comprobar que el secreto M3U_URL esta configurado
        id: comprobar
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: |
          if [ -z "$M3U_URL" ]; then
            echo "::warning::El secreto M3U_URL no esta configurado. Se omite la generacion de la EPG."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar epg.xml y lista.m3u desde la lista M3U y las guias reales
        if: steps.comprobar.outputs.configurado == 'true'
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          EPG_REPO_URL: ${{ vars.EPG_REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
          # URL publica de la guia que se declara en la cabecera del M3U
          # (x-tvg-url/url-tvg). Por defecto, el raw de este repositorio.
          EPG_PUBLICA_URL: ${{ vars.EPG_PUBLICA_URL || format('{0}/{1}/raw/main/epg.xml', github.server_url, github.repository) }}
          # Paises de los que se descargan las guias EPG reales. Se puede
          # sobrescribir con la variable de repositorio EPG_PAISES (por ejemplo
          # EPG_PAISES=MX,ES para acortar el tiempo de ejecucion).
          EPG_PAISES: ${{ vars.EPG_PAISES || 'MX,ES,AR,CO,CL,PE,EC,UY,CR,PA,DO,SV,PT,IT,DE,FR,US' }}
          # Guias extra que se suman a las de los paises: DSports/DIRECTV Sports
          # (epg_ripper_UY1 para DSports y DSports +, y epg_ripper_DIRECTVSPORTS1
          # para DSports 2 y Motor), Pluto TV, Samsung TV Plus y Roku. Dejar
          # la variable vacia (o sin definir) para usar las de por defecto.
          EPG_URLS_EXTRA: ${{ vars.EPG_URLS_EXTRA }}
          # Opcional: sustituir por completo las fuentes por URLs propias
          # (separadas por comas). Si se define, no se usan los paises.
          EPG_URL: ${{ vars.EPG_URL }}
          # Listas M3U de apoyo que se fusionan con la del proveedor para
          # completar Espana, Latam y US Latino. Admite atajos de iptv-org
          # (iptv-org-es, iptv-org-mx, iptv-org-ar, iptv-org-co, iptv-org-cl,
          # iptv-org-pe, iptv-org-us, iptv-org-deportes...), el atajo
          # tecnotv-deportes (lista de deportes con NBA TV, ESPN y FOX Sports
          # Mexico) o URLs propias separadas por comas. De las listas de apoyo
          # solo se aceptan canales de EE. UU., Espana y Latinoamerica. Vacía o
          # sin definir deja las de por defecto; el valor "ninguna" las
          # desactiva (equivale a --sin-m3u-extra).
          M3U_EXTRA_URL: ${{ vars.M3U_EXTRA_URL }}
          # JSON con las categorias tematicas NBA y Beisbol (por defecto
          # categorias_tematicas.json). Vacio o sin definir usa el del
          # repositorio.
          M3U_CATEGORIAS: ${{ vars.M3U_CATEGORIAS }}
          # Maximo de senales publicadas por canal: 1 principal + N-1 respaldos
          # (3 por defecto). Vacio o sin definir deja 3.
          M3U_MAXIMO_SENALES: ${{ vars.M3U_MAXIMO_SENALES }}
        run: python generar_epg.py --salida epg.xml --m3u-salida lista.m3u

      - name: Verificar que el XMLTV y la lista M3U son validos y estan sincronizados
        if: steps.comprobar.outputs.configurado == 'true'
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET

          # Mismas reglas que el generador (jerarquia y alias de los grupos).
          import generar_epg

          raiz = ET.parse("epg.xml").getroot()
          canales = {canal.get("id") for canal in raiz.findall("channel")}
          programas = raiz.findall("programme")
          con_epg = {programa.get("channel") for programa in programas}
          print(f"canales={len(canales)} programas={len(programas)} canales_con_epg={len(con_epg)}")

          assert raiz.tag == "tv", "la raiz debe ser <tv>"
          assert canales, "la guia no tiene canales"
          assert programas, "la guia no tiene programacion"

          huerfanos = [p.get("channel") for p in programas if p.get("channel") not in canales]
          assert not huerfanos, f"programas sin canal: {huerfanos[:5]}"

          vistos = set()
          for programa in programas:
              assert programa.find("title") is not None, f"programa sin titulo: {programa.get('start')}"
              clave = (programa.get("channel"), programa.get("start"))
              assert clave not in vistos, f"programa duplicado: {clave}"
              vistos.add(clave)

          # --- lista.m3u: sincronizada con la guia y con las senales de respaldo ---
          with open("lista.m3u", encoding="utf-8") as archivo:
              lineas = [linea.strip() for linea in archivo if linea.strip()]

          assert lineas and lineas[0].startswith("#EXTM3U"), "falta la cabecera #EXTM3U"
          assert "x-tvg-url=" in lineas[0], "la cabecera no declara la guia (x-tvg-url)"

          entradas = []
          pendiente = None
          for linea in lineas:
              if linea.startswith("#EXTINF"):
                  pendiente = linea
              elif linea.startswith("#"):
                  continue
              elif pendiente:
                  entradas.append((pendiente, linea))
                  pendiente = None

          assert entradas, "la lista M3U no tiene entradas"
          assert all(url.startswith(("http://", "https://")) for _extinf, url in entradas), \
              "hay entradas sin URL valida"

          def atributo(linea: str, nombre: str) -> str:
              import re

              coincidencia = re.search(rf'{nombre}="([^"]*)"', linea)
              return coincidencia.group(1) if coincidencia else ""

          sin_id = [url for extinf, url in entradas if not atributo(extinf, "tvg-id")]
          assert not sin_id, f"entradas sin tvg-id: {sin_id[:5]}"

          ids_m3u = {atributo(extinf, "tvg-id") for extinf, _url in entradas}
          fuera = sorted(ids_m3u - canales)
          assert not fuera, f"tvg-id del M3U que no existen en epg.xml: {fuera[:5]}"

          urls = [url for _extinf, url in entradas]
          repetidas = {url for url in urls if urls.count(url) > 1}
          if repetidas:
              # No es un error: el canal se repite por sus respaldos y por las
              # categorias tematicas (misma URL en varios grupos).
              print(f"aviso: {len(repetidas)} URLs repetidas (respaldo/tematica)")

          # Limite estricto: 1 principal + 2 respaldos por canal y grupo. Las
          # categorias tematicas (NBA, Beisbol) repiten el canal con el mismo
          # tvg-id, asi que el limite se comprueba por (grupo, canal).
          por_grupo = {}
          for extinf, _url in entradas:
              identificador = atributo(extinf, "tvg-id")
              grupo = atributo(extinf, "group-title")
              por_grupo[(grupo, identificador)] = por_grupo.get((grupo, identificador), 0) + 1
          excedidos = {clave: total for clave, total in por_grupo.items() if total > 3}
          assert not excedidos, f"canales con mas de 3 senales en un grupo: {list(excedidos.items())[:5]}"
          print(f"maximo de senales por canal y grupo: {max(por_grupo.values())} (limite 3)")

          respaldos = len(entradas) - len(por_grupo)
          print(
              f"lista.m3u: entradas={len(entradas)} canales={len(ids_m3u)} "
              f"canales_por_grupo={len(por_grupo)} senales_respaldo={respaldos}"
          )

          # Categorias tematicas: el canal se repite en su grupo y en el tematico.
          total_jerarquia = len(generar_epg.ORDEN_GRUPOS_M3U)
          tematicas = {}
          for extinf, _url in entradas:
              grupo = atributo(extinf, "group-title")
              # Los grupos de la jerarquia (con sus alias) son las tematicas.
              if generar_epg.orden_del_grupo(grupo)[0] < total_jerarquia:
                  tematicas.setdefault(grupo, set()).add(atributo(extinf, "tvg-id"))
          print(
              "categorias tematicas: "
              + ", ".join(
                  f"{grupo}={len(canales_tematicos)} canales"
                  for grupo, canales_tematicos in tematicas.items()
              )
          )
          for grupo, canales_tematicos in tematicas.items():
              fuera_tematica = sorted(canales_tematicos - canales)
              assert not fuera_tematica, f"{grupo}: tvg-id fuera de la guia: {fuera_tematica[:5]}"

          # Orden jerarquico de los grupos (misma funcion que usa generar_epg.py).
          orden_grupos = []
          for extinf, _url in entradas:
              grupo = atributo(extinf, "group-title")
              if grupo not in orden_grupos:
                  orden_grupos.append(grupo)

          claves = [generar_epg.orden_del_grupo(grupo) for grupo in orden_grupos]
          assert claves == sorted(claves), f"grupos fuera de la jerarquia: {orden_grupos[:20]}"
          assert "" not in orden_grupos[:-1], "los canales sin grupo deben ir al final"
          print("orden de grupos OK: " + " > ".join(orden_grupos[:16]))
          print(f"OK: {len(con_epg)} canales con programacion real de {len(canales)}")
          PY

      - name: Commit y push de epg.xml y lista.m3u
        if: steps.comprobar.outputs.configurado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml lista.m3u
          if git diff --cached --quiet; then
            echo "epg.xml y lista.m3u sin cambios; no se hace commit."
          else
            git commit -m "chore(epg): actualizar guia y lista M3U $(date -u +%Y-%m-%d)"
            git push
          fi
