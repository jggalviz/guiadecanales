name: Actualizar EPG

# Regenera epg.xml a diario, al hacer push y bajo demanda.
on:
  schedule:
    # Todos los dias a las 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generar_epg.py"
      - "tests/**"
      - ".github/workflows/actualizar-epg.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-epg
  cancel-in-progress: true

jobs:
  generar:
    name: Generar y publicar epg.xml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Comprobar que el secreto M3U_URL esta configurado
        id: comprobar
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
        run: |
          if [ -z "$M3U_URL" ]; then
            echo "::warning::El secreto M3U_URL no esta configurado. Se omite la generacion de la EPG."
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generar epg.xml desde la lista M3U y las guias reales
        if: steps.comprobar.outputs.configurado == 'true'
        env:
          M3U_URL: ${{ secrets.M3U_URL }}
          EPG_REPO_URL: ${{ vars.EPG_REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
          # Paises de los que se descargan las guias EPG reales. Se puede
          # sobrescribir con la variable de repositorio EPG_PAISES (por ejemplo
          # EPG_PAISES=MX,ES para acortar el tiempo de ejecucion).
          EPG_PAISES: ${{ vars.EPG_PAISES || 'MX,ES,AR,CO,CL,PE,EC,UY,CR,PA,DO,SV,PT,IT,FR,DE,US' }}
          # Guias extra que se suman a las de los paises (Pluto TV, Samsung TV
          # Plus y Roku). Dejar la variable vacia para usar las de por defecto.
          EPG_URLS_EXTRA: ${{ vars.EPG_URLS_EXTRA }}
          # Opcional: sustituir por completo las fuentes por URLs propias
          # (separadas por comas). Si se define, no se usan los paises.
          EPG_URL: ${{ vars.EPG_URL }}
        run: python generar_epg.py --salida epg.xml

      - name: Verificar que el XMLTV es valido
        if: steps.comprobar.outputs.configurado == 'true'
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET

          raiz = ET.parse("epg.xml").getroot()
          canales = {canal.get("id") for canal in raiz.findall("channel")}
          programas = raiz.findall("programme")
          con_epg = {programa.get("channel") for programa in programas}
          print(f"canales={len(canales)} programas={len(programas)} canales_con_epg={len(con_epg)}")

          assert raiz.tag == "tv", "la raiz debe ser <tv>"
          assert canales, "la guia no tiene canales"
          assert programas, "la guia no tiene programacion"

          huerfanos = [p.get("channel") for p in programas if p.get("channel") not in canales]
          assert not huerfanos, f"programas sin canal: {huerfanos[:5]}"

          vistos = set()
          for programa in programas:
              assert programa.find("title") is not None, f"programa sin titulo: {programa.get('start')}"
              clave = (programa.get("channel"), programa.get("start"))
              assert clave not in vistos, f"programa duplicado: {clave}"
              vistos.add(clave)

          print(f"OK: {len(con_epg)} canales con programacion real de {len(canales)}")
          PY

      - name: Commit y push de epg.xml
        if: steps.comprobar.outputs.configurado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if git diff --cached --quiet; then
            echo "epg.xml sin cambios; no se hace commit."
          else
            git commit -m "chore(epg): actualizar guia $(date -u +%Y-%m-%d)"
            git push
          fi
